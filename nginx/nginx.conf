worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Hide server identity ─────────────────────────────────────────────────
    server_tokens off;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 20;

    # ── Request size limits ──────────────────────────────────────────────────
    client_max_body_size   11M;
    client_body_timeout    15s;
    client_header_timeout  10s;
    send_timeout           30s;
    keepalive_timeout      65s;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream nextjs {
        server web:3000;
        keepalive 32;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options              "SAMEORIGIN"                                           always;
        add_header X-Content-Type-Options       "nosniff"                                              always;
        add_header X-XSS-Protection             "1; mode=block"                                        always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"                      always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"                                          always;
        add_header Cross-Origin-Resource-Policy "same-origin"                                          always;
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains"                  always;

        # Content Security Policy
        # style-src needs 'unsafe-inline' for TipTap
        # connect-src allows wss: for Hocuspocus WebSocket
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
            always;

        # ── Block sensitive file patterns ─────────────────────────────────────
        location ~* \.(git|env|htaccess|htpasswd|sql|bak|log|swp)$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }

        # ── Login — strict brute-force protection ─────────────────────────────
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_log_level warn;

            proxy_pass             http://nextjs;
            proxy_http_version     1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── File uploads — rate limited ───────────────────────────────────────
        location ~* ^/api/(eqms/files|projects/[^/]+/files)$ {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 11M;

            proxy_pass             http://nextjs;
            proxy_http_version     1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass             http://nextjs;
            proxy_http_version     1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Hocuspocus WebSocket ──────────────────────────────────────────────
        location /collaboration {
            # Only allow actual WebSocket upgrades
            if ($http_upgrade != "websocket") {
                return 426;
            }

            proxy_pass          http://hocuspocus:1234;
            proxy_http_version  1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 86400;
        }

        # ── Next.js app ───────────────────────────────────────────────────────
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass             http://nextjs;
            proxy_http_version     1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
